name: Lazarus
options:
  bundleIdPrefix: ar.despertador
  deploymentTarget:
    iOS: "17.0"
targets:
  Lazarus:
    type: application
    platform: iOS
    sources:
      - path: Lazarus
    info:
      path: Lazarus/Info.plist
      properties:
        CFBundleDisplayName: Lazarus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: es
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Lazarus escucha tu lectura del Evangelio para apagar la alarma."
        NSSpeechRecognitionUsageDescription: "Lazarus reconoce tu voz para seguir la lectura palabra por palabra."
        NSAlarmKitUsageDescription: "Lazarus te despierta con una alarma que se apaga leyendo el Evangelio del día."
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.despertador.lazarus
        PRODUCT_NAME: Lazarus
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
