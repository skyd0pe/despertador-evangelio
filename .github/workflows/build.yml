name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk DespertadorEvangelio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DespertadorEvangelio
          path: DespertadorEvangelio.apk

      - name: Publicar para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versión 1.0.${{ github.run_number }}
          body: |
            Descargá **DespertadorEvangelio.apk** desde el celular e instalalo.
            Si ya tenés una versión anterior, se instala encima sin perder los ajustes.
          files: DespertadorEvangelio.apk
          make_latest: true
