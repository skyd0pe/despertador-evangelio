name: Compilar APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Comprobar que está la contraseña de la clave
        env:
          LAZARUS_KEY_PASSWORD: ${{ secrets.LAZARUS_KEY_PASSWORD }}
        run: |
          if [ -z "$LAZARUS_KEY_PASSWORD" ]; then
            echo "::error::Falta el secreto LAZARUS_KEY_PASSWORD en Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Compilar
        env:
          LAZARUS_KEY_PASSWORD: ${{ secrets.LAZARUS_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Renombrar y verificar la firma
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Lazarus.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          FP=$("$SIGNER" verify --print-certs Lazarus.apk | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "Firma: $FP"
          if [ "$FP" != "6b14a0770e8805af91f904b4127848c77dc667d4fe816c03b0198ac8926b41f9" ]; then
            echo "::error::El instalador no está firmado con la clave de Lazarus."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lazarus
          path: Lazarus.apk

      - name: Publicar para descargar desde el celular
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versión 1.0.${{ github.run_number }}
          body: |
            Descargá **Lazarus.apk** desde el celular e instalalo.
            Si ya tenés una versión anterior, se instala encima sin perder los ajustes.
          files: Lazarus.apk
          make_latest: true
