name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bajar tipografías (Cormorant Garamond y Source Serif 4, licencia OFL)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/fonts
          get() {
            url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/google/fonts/contents/ofl/$1" \
              | jq -r '[.[] | select(.name | endswith(".ttf")) | select(.name | test("Italic") | not)]
                       | sort_by(.name | contains("[") | not) | .[0].download_url')
            echo "$1 -> $url"
            curl -fsSL "$url" -o "app/src/main/assets/fonts/$2"
          }
          get cormorantgaramond display.ttf
          get sourceserif4 text.ttf
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/sourceserif4/OFL.txt" -o app/src/main/assets/fonts/OFL.txt || true
          ls -la app/src/main/assets/fonts

      - name: Compilar
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk Lazarus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lazarus
          path: Lazarus.apk

      - name: Publicar para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versión 1.0.${{ github.run_number }}
          body: |
            Descargá **Lazarus.apk** desde el celular e instalalo.
            Si ya tenés una versión anterior, se instala encima sin perder los ajustes.
          files: Lazarus.apk
          make_latest: true
